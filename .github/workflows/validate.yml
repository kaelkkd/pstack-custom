name: Validate ports

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/pstack.py check
      - run: python -m unittest discover -s tests
      - run: node --check pi/extensions/pstack-task.js
      - name: Install Pi in an isolated test directory
        run: npm install --prefix .pi-smoke --no-save --ignore-scripts @earendil-works/pi-coding-agent@1.3.0
      - name: Verify Pi package loading
        run: python scripts/check_pi_runtime.py
