name: Validate ports

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/pstack.py check
      - run: python -m unittest discover -s tests
      - run: node --check pi/extensions/pstack-task.js
      - name: Install Pi in an isolated test directory
        run: npm install --prefix .pi-smoke --no-save --ignore-scripts @earendil-works/pi-coding-agent@1.3.0
      - name: Verify Pi package loading
        run: python scripts/check_pi_runtime.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Test poteto-mode helpers
        working-directory: codex/skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun test watch-pr check-plan.test.ts
          bun run typecheck
      - name: Install statechart test dependencies
        run: npm install --prefix codex/skills/statechart/scripts --no-save --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Test statechart parsing, replay, and SVG rendering
        env:
          TLA2TOOLS: ''
        run: npm --prefix codex/skills/statechart/scripts test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare TLA+ verifier for statechart tests
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Test statechart commands with TLC
        run: python scripts/check_statechart_runtime.py

  statechart-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare TLA+ verifier
        shell: pwsh
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'tla2tools.jar'
          Invoke-WebRequest -Uri 'https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar' -OutFile $jar
          if ((Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash -ne '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88') {
            throw 'TLA+ checksum mismatch'
          }
          "TLA2TOOLS=$jar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test both statechart ports on Windows
        run: python scripts/check_statechart_runtime.py
